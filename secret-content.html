<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SECRET｜甘味甘舎</title>

  <style>
    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    html {
      background: #000;
    }

    body {
      margin: 0;
      padding: 0;

      background: #000;
      color: #d00000;

      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        serif;

      -webkit-text-size-adjust: 100%;
    }


    /* =========================
       ページ全体
    ========================= */

    .secret-page {
      width: 100%;
      min-height: 100vh;

      padding: 60px 24px;
    }


    /* =========================
       メイン
    ========================= */

    .secret-container {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;
    }


    /* =========================
       ページタイトル
    ========================= */

    .page-heading {
      text-align: center;

      margin-bottom: 70px;
    }

    .page-heading .ornament {
      margin-bottom: 25px;

      font-size: 22px;
      line-height: 1;
    }

    .page-heading h1 {
      margin: 0;

      font-size: clamp(28px, 6vw, 42px);
      font-weight: normal;

      letter-spacing: 0.25em;
    }

    .page-heading p {
      margin: 18px 0 0;

      font-size: 12px;
      letter-spacing: 0.25em;
    }


    /* =========================
       説明
    ========================= */

    .intro {
      margin: 0 auto 60px;

      max-width: 600px;

      text-align: center;

      font-size: clamp(12px, 2vw, 14px);

      line-height: 2.2;
      letter-spacing: 0.1em;
    }


    /* =========================
       作品一覧
    ========================= */

    .works {
      width: 100%;
    }


    /* =========================
       作品
    ========================= */

    .work {
      padding: 30px 5px;

      border-top: 1px solid #720000;
    }

    .work:last-child {
      border-bottom: 1px solid #720000;
    }


    /* タイトル */

    .work-title {
      display: inline-block;

      color: #d00000;

      font-size: clamp(18px, 4vw, 23px);

      line-height: 1.6;
      letter-spacing: 0.1em;

      text-decoration: none;
    }

    .work-title:hover {
      text-decoration: underline;
    }


    /* 説明 */

    .work-description {
      margin: 10px 0 0;

      color: #a80000;

      font-size: clamp(11px, 2.8vw, 13px);

      line-height: 2;

      letter-spacing: 0.06em;
    }


    /* =========================
       カテゴリ
    ========================= */

    .category {
      display: inline-block;

      margin-bottom: 10px;

      color: #8f0000;

      font-size: 10px;

      letter-spacing: 0.15em;
    }


    /* =========================
       下部ナビ
    ========================= */

    .navigation {
      margin-top: 70px;

      display: flex;
      justify-content: center;
      gap: 35px;

      text-align: center;
    }

    .navigation a {
      color: #d00000;

      font-size: 12px;

      letter-spacing: 0.12em;

      text-decoration: none;
    }

    .navigation a:hover {
      text-decoration: underline;
    }


    /* =========================
       スマートフォン
       600px以下
    ========================= */

    @media screen and (max-width: 600px) {

      .secret-page {
        padding: 45px 18px;
      }


      .page-heading {
        margin-bottom: 50px;
      }


      .page-heading .ornament {
        margin-bottom: 20px;

        font-size: 20px;
      }


      .page-heading h1 {
        font-size: 28px;

        letter-spacing: 0.2em;
      }


      .page-heading p {
        margin-top: 15px;

        font-size: 10px;
      }


      .intro {
        margin-bottom: 45px;

        font-size: 11px;

        line-height: 2.1;

        letter-spacing: 0.07em;
      }


      .work {
        padding: 25px 3px;
      }


      .work-title {
        font-size: 18px;

        letter-spacing: 0.06em;
      }


      .work-description {
        margin-top: 8px;

        font-size: 11px;

        line-height: 1.9;

        letter-spacing: 0.04em;
      }


      .category {
        margin-bottom: 7px;

        font-size: 9px;
      }


      .navigation {
        margin-top: 55px;

        gap: 25px;
      }


      .navigation a {
        font-size: 11px;
      }
    }


    /* =========================
       小さいスマホ
       380px以下
    ========================= */

    @media screen and (max-width: 380px) {

      .secret-page {
        padding: 35px 14px;
      }


      .page-heading h1 {
        font-size: 25px;
      }


      .intro {
        font-size: 10px;
      }


      .work-title {
        font-size: 17px;
      }


      .work-description {
        font-size: 10px;
      }


      .navigation {
        flex-direction: column;

        gap: 18px;
      }
    }
  </style>
</head>


<body>

  <main class="secret-page">

    <div class="secret-container">


      <!-- =====================

      <header class="page-heading">

        <div class="ornament">

        </div>

        <h1>

      <!-- =====================

      <p class="intro">
        ここには通常ページとは分けて掲載している作品があります。<br>
        内容をご確認のうえ、お楽しみください。
      </p>


      <!-- =====================

      ====================== -->

      <section class="works">


        <!-- 作品01 -->

        <article class="work">

          <span class="category">
            ジェイド×ブロッケンJr.
          </span>

          <br>

          <a
            href="secret-work01.html"
            class="work-title"
          >
            作品タイトル1
          </a>

          <p class="work-description">
            作品の簡単な説明をここに入れます。
            作品の雰囲気や内容を短く紹介する場所です。
          </p>

        </article>


        <!-- 作品02 -->

        <article class="work">

          <span class="category">
            ジェイド×ブロッケンJr.
          </span>

          <br>

          <a
            href="secret-work02.html"
            class="work-title"
          >
            作品タイトル2
          </a>

          <p class="work-description">
            作品の簡単な説明をここに入れます。
            必要なら注意書きを短く入れてもOKです。
          </p>

        </article>


        <!-- 作品03 -->

        <article class="work">

          <span class="category">
            その他
          </span>

          <br>

          <a
            href="secret-work03.html"
            class="work-title"
          >
            作品タイトル3
          </a>

          <p class="work-description">
            作品の簡単な説明をここに入れます。
          </p>

        </article>


      </section>


      <!-- =====================
           下部ナビ
      ====================== -->

      <nav class="navigation">

        <a href="index.html">
          ← TOPへ戻る
        </a>

      </nav>


    </div>

  </main>

</body>
</html>
