<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WEB CLAP | 甘味甘舎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f4f1e8;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.9;
    }

    main {
      max-width: 575px;
      margin: 70px auto 100px;
      padding: 0 24px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 55px;
    }

    .page-title h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.18em;
    }

    .page-title p {
      margin: 5px 0 0;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #777;
    }

    .divider {
      border-top: 1px solid #ccc7ba;
      margin-bottom: 35px;
    }

    .intro {
      margin: 0 0 30px;
      text-align: center;
      font-size: 13px;
    }

    .form-area {
      width: 100%;
      overflow: hidden;
    }

    .form-area iframe {
      display: block;
      width: 100%;
      min-height: 700px;
      border: none;
    }

    .back {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid #ccc7ba;
      text-align: center;
    }

    .back a {
      color: #555;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.15em;
    }

    .back a:hover {
      opacity: 0.55;
    }

    .copyright {
      margin-top: 30px;
      text-align: center;
      color: #777;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    @media (max-width: 480px) {
      main {
        margin-top: 55px;
        padding: 0 22px;
      }

      .page-title {
        margin-bottom: 45px;
      }

      .intro {
        font-size: 12px;
      }

      .form-area iframe {
        min-height: 720px;
      }
    }
  </style>
</head>

<body>

  <main>

    <div class="page-title">
      <h1>WEB CLAP</h1>
      <p>拍手</p>
    </div>

    <div class="divider"></div>

    <p class="intro">
      拍手・メッセージをありがとうございます。<br>
      とても励みになります。
    </p>

    <div class="form-area">

      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSfgbn62qpML0nMLtTLhT9u_exzTE4SYTbzdfLgnvBjPxKuRxQ/viewform?embedded=true"
        loading="lazy">
      </iframe>

    </div>

    <div class="back">
      <a href="index.html">← TOP</a>
    </div>

    <div class="copyright">
      © 甘味甘舎
    </div>

  </main>

</body>
</html>
