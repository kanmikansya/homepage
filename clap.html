<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEB CLAP｜甘味甘舎</title>

<style>
body {
    margin: 0;
    background: #f4f1e8;
    color: #333;
    font-family: sans-serif;
    line-height: 1.9;
}

.container {
    max-width: 650px;
    margin: 0 auto;
    padding: 55px 20px 60px;
}

/* ページタイトル */
.page-title {
    text-align: center;
    font-size: 25px;
    font-weight: normal;
    letter-spacing: 0.15em;
    margin: 0 0 8px;
}

/* 英語サブタイトル */
.subtitle {
    text-align: center;
    color: #888;
    font-size: 11px;
    letter-spacing: 0.15em;
    margin-bottom: 35px;
}

/* 区切り線 */
.divider {
    border-top: 1px solid #aaa;
    margin-bottom: 40px;
}

/* 説明 */
.description {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.05em;
    margin-bottom: 30px;
}

/* Googleフォーム */
.form-area {
    width: 100%;
    overflow: hidden;
}

.form-area iframe {
    display: block;
    width: 100%;
    min-height: 650px;
    border: none;
}

/* 戻る */
.back-link {
    margin-top: 35px;
    padding-top: 25px;
    border-top: 1px solid #aaa;
    text-align: center;
}

.back-link a {
    color: #333;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-decoration: underline;
    text-underline-offset: 5px;
}

/* コピーライト */
.copyright {
    margin-top: 35px;
    text-align: center;
    color: #888;
    font-size: 11px;
}


/* スマホ */
@media (max-width: 600px) {

    .container {
        padding: 45px 14px 50px;
    }

    .page-title {
        font-size: 23px;
    }

    .description {
        font-size: 12px;
    }

    .form-area iframe {
        min-height: 700px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="page-title">WEB CLAP</h1>

    <div class="subtitle">
        WEB CLAP
    </div>

    <div class="divider"></div>

    <p class="description">
        拍手・メッセージをありがとうございます。<br>
        とても励みになります。
    </p>

    <div class="form-area">

        <iframe
            src="https://docs.google.com/forms/d/e/1FAIpQLSfgbn62qpML0nMLtTLhT9u_exzTE4SYTbzdfLgnvBjPxKuRxQ/viewform?embedded=true">
        </iframe>

    </div>

    <div class="back-link">
        <a href="index.html">← TOP</a>
    </div>

    <div class="copyright">
        © 甘味甘舎
    </div>

</div>

</body>
</html>
