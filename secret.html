<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- スマホ対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WARNING｜甘味甘舎</title>

  <style>
    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    html {
      background: #000;
    }

    body {
      margin: 0;
      padding: 0;

      background: #000;
      color: #d00000;

      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        serif;

      -webkit-text-size-adjust: 100%;
    }


    /* =========================
       全体
    ========================= */

    .warning-page {
      width: 100%;
      min-height: 100vh;

      padding: 40px 24px;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================
       赤い枠
    ========================= */

    .warning-box {
      position: relative;

      width: 100%;
      max-width: 760px;

      min-height: calc(100vh - 80px);

      padding: 80px 50px 60px;

      border: 1px solid #d00000;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }


    /* 四隅の装飾 */

    .warning-box::before,
    .warning-box::after {
      content: "";

      position: absolute;

      width: 28px;
      height: 28px;
    }

    .warning-box::before {
      top: 10px;
      left: 10px;

      border-top: 1px solid #d00000;
      border-left: 1px solid #d00000;
    }

    .warning-box::after {
      right: 10px;
      bottom: 10px;

      border-right: 1px solid #d00000;
      border-bottom: 1px solid #d00000;
    }


    /* =========================
       飾り
    ========================= */

    .ornament {
      margin-bottom: 55px;

      color: #d00000;

      font-size: 25px;
      line-height: 1;
    }


    /* =========================
       タイトル
    ========================= */

    .warning-title {
      margin: 0;

      color: #d00000;

      font-size: clamp(22px, 4vw, 38px);
      font-weight: normal;

      line-height: 1.9;
      letter-spacing: 0.12em;

      text-align: center;
    }


    /* =========================
       注意書き
    ========================= */

    .warning-text {
      margin: 40px 0 0;

      color: #d00000;

      font-size: clamp(12px, 2vw, 15px);

      line-height: 2.2;
      letter-spacing: 0.12em;

      text-align: center;
    }


    /* =========================
       区切り線
    ========================= */

    .divider {
      width: min(70%, 430px);

      margin: 60px auto 50px;

      display: flex;
      align-items: center;
      gap: 18px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      background: #d00000;

      flex: 1;
    }

    .divider span {
      color: #d00000;

      font-size: 18px;
      line-height: 1;
    }


    /* =========================
       質問
    ========================= */

    .question {
      margin: 0 0 35px;

      color: #d00000;

      font-size: clamp(13px, 2vw, 17px);

      line-height: 1.8;
      letter-spacing: 0.15em;

      text-align: center;
    }


    /* =========================
       はい・いいえ
    ========================= */

    .buttons {
      width: 100%;
      max-width: 500px;

      display: flex;
      justify-content: center;

      gap: 25px;
    }

    .choice {
      width: 200px;
      min-height: 65px;

      display: flex;
      justify-content: center;
      align-items: center;

      border: 1px solid #d00000;

      color: #d00000;

      background: transparent;

      text-decoration: none;

      font-size: 16px;
      letter-spacing: 0.2em;

      transition:
        background-color 0.25s ease,
        color 0.25s ease;
    }


    /* PCでマウスを乗せたとき */

    .choice:hover {
      background: #d00000;
      color: #000;
    }


    /* =========================
       TOPへ戻る
    ========================= */

    .back-top {
      margin-top: 65px;

      color: #d00000;

      font-size: 13px;
      letter-spacing: 0.12em;

      text-decoration: underline;

      transition: opacity 0.2s ease;
    }

    .back-top:hover {
      opacity: 0.6;
    }


    /* =========================
       スマートフォン
       600px以下
    ========================= */

    @media screen and (max-width: 600px) {

      .warning-page {
        padding: 20px 12px;
      }


      .warning-box {
        min-height: calc(100vh - 40px);

        padding: 55px 18px 45px;
      }


      .warning-box::before,
      .warning-box::after {
        width: 22px;
        height: 22px;
      }


      .warning-box::before {
        top: 8px;
        left: 8px;
      }

      .warning-box::after {
        right: 8px;
        bottom: 8px;
      }


      .ornament {
        margin-bottom: 40px;

        font-size: 22px;
      }


      .warning-title {
        font-size: clamp(20px, 6vw, 28px);

        line-height: 1.9;
        letter-spacing: 0.08em;
      }


      .warning-text {
        margin-top: 30px;

        font-size: clamp(11px, 3.2vw, 14px);

        line-height: 2.1;
        letter-spacing: 0.08em;
      }


      .divider {
        width: 85%;

        margin: 45px auto 40px;

        gap: 12px;
      }


      .question {
        margin-bottom: 30px;

        font-size: clamp(12px, 3.5vw, 15px);

        letter-spacing: 0.1em;
      }


      .buttons {
        gap: 12px;
      }


      .choice {
        width: 45%;

        min-height: 58px;

        font-size: 14px;

        letter-spacing: 0.15em;
      }


      .back-top {
        margin-top: 50px;

        font-size: 12px;
      }
    }


    /* =========================
       小さいスマホ
       380px以下
    ========================= */

    @media screen and (max-width: 380px) {

      .warning-page {
        padding: 12px 8px;
      }


      .warning-box {
        min-height: calc(100vh - 24px);

        padding: 45px 14px 35px;
      }


      .warning-title {
        font-size: 20px;

        letter-spacing: 0.05em;
      }


      .warning-text {
        font-size: 11px;

        letter-spacing: 0.04em;
      }


      .divider {
        width: 90%;
      }


      .buttons {
        gap: 8px;
      }


      .choice {
        min-height: 54px;

        font-size: 13px;

        letter-spacing: 0.1em;
      }


      .back-top {
        margin-top: 45px;

        font-size: 11px;
      }
    }
  </style>
</head>


<body>

  <main class="warning-page">

    <section class="warning-box">

      <!-- 上の飾り -->
      <div class="ornament">✦</div>


      <!-- 注意文 -->
      <h1 class="warning-title">
        この先には、<br>
        人を選ぶ内容が含まれます。
      </h1>


      <p class="warning-text">
        閲覧は自己責任でお願いします。<br>
        また、未成年の方の閲覧はご遠慮ください。
      </p>


      <!-- 区切り -->
      <div class="divider">
        <span>✦</span>
      </div>


      <!-- 質問 -->
      <p class="question">
        このページを閲覧しますか？
      </p>


      <!-- ボタン -->
      <div class="buttons">

        <!-- はい → 隠しページ -->
        <a
          href="secret-content.html"
          class="choice"
        >
          はい
        </a>


        <!-- いいえ → Yahoo! JAPAN -->
        <a
          href="https://www.yahoo.co.jp/"
          class="choice"
          target="_blank"
          rel="noopener noreferrer"
        >
          いいえ
        </a>

      </div>


      <!-- 通常TOPへ -->
      <a
        href="index.html"
        class="back-top"
      >
        ← TOPへ戻る
      </a>


      <!-- 下の飾り -->
      <div
        class="ornament"
        style="margin-top: 90px; margin-bottom: 0;"
      >
        ✦
      </div>

    </section>

  </main>

</body>
</html>
